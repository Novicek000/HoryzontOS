# Menu płyty instalacyjnej HoryzontOS @VERSION@
set default=install
set timeout=10
set timeout_style=menu
set color_normal=light-gray/blue
set color_highlight=blue/light-gray
set menu_color_normal=light-gray/blue
set menu_color_highlight=blue/light-gray
insmod part_gpt
insmod part_msdos
insmod iso9660
insmod all_video
insmod ext2
insmod btrfs
insmod xfs
insmod regexp
search --no-floppy --set=root -l '@LABEL@'
set isoroot=$root
# czcionka z polskimi znakami (tryb graficzny konsoli GRUB-a)
insmod font
insmod gfxterm
if loadfont ($isoroot)/boot/grub2/fonts/unicode.pf2; then
    set gfxmode=1024x768,800x600,auto
    set gfxpayload=keep
    terminal_output gfxterm
fi

# Czy na dysku jest już zainstalowany HoryzontOS? Wtedy domyślnie uruchamiamy system z dysku
# (jak „Naciśnij dowolny klawisz, aby uruchomić komputer z dysku CD...”).
set hdroot=""
search --no-floppy --file --set=hdroot /boot/grub2/horyzontos-installed
if [ -z "$hdroot" ]; then search --no-floppy --file --set=hdroot /root/boot/grub2/horyzontos-installed; fi
if [ -n "$hdroot" ]; then
    if [ "$hdroot" != "$isoroot" ]; then
        set default=hd
        set timeout=8
    fi
fi
set root=$isoroot

set live="root=live:CDLABEL=@LABEL@ rd.live.image rd.live.overlay.overlayfs=1 selinux=0 quiet loglevel=3 rd.udev.log_level=3 systemd.show_status=false rd.systemd.show_status=false vt.global_cursor_default=0 systemd.unit=horyzontos-installer.target splash"

menuentry "Zainstaluj system HoryzontOS @VERSION@" --id install {
    linux /images/pxeboot/vmlinuz $live plymouth.splash=horyzont-setup horyzontos.lang=pl
    initrd /images/pxeboot/initrd.img
}
menuentry "Install HoryzontOS @VERSION@ (English)" --id install-en {
    linux /images/pxeboot/vmlinuz $live plymouth.splash=horyzont-setup-en horyzontos.lang=en
    initrd /images/pxeboot/initrd.img
}
menuentry "Sprawdź nośnik i zainstaluj system HoryzontOS" --id check {
    linux /images/pxeboot/vmlinuz $live plymouth.splash=horyzont-setup horyzontos.lang=pl rd.live.check
    initrd /images/pxeboot/initrd.img
}
menuentry "Zainstaluj system HoryzontOS (podstawowa grafika)" --id basic {
    linux /images/pxeboot/vmlinuz $live plymouth.splash=horyzont-setup horyzontos.lang=pl nomodeset
    initrd /images/pxeboot/initrd.img
}
if [ -n "$hdroot" ]; then
menuentry "Uruchom system z dysku twardego" --id hd {
    if [ "$grub_platform" = "efi" ]; then
        exit
    else
        regexp --set=1:hddisk '^([^,]+)' "$hdroot"
        set root=($hddisk)
        chainloader +1
    fi
}
fi
if [ "$grub_platform" = "efi" ]; then
menuentry "Ustawienia oprogramowania układowego UEFI" --id uefi-firmware {
    fwsetup
}
fi
