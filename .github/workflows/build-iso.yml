# Budowanie obrazu ISO HoryzontOS w GitHub Actions.
# Uruchomienie: zakładka Actions → „Zbuduj ISO” → Run workflow, albo utworzenie wydania (Release) z tagiem v*.
# Wydanie buduje kod z TAGU wydania — nowy tag twórz z aktualnej gałęzi main (np. v1.0.1).
# Pole „Dołącz do wydania” w Run workflow: buduje z main i podmienia ISO w istniejącym wydaniu.
name: Zbuduj ISO

on:
  workflow_dispatch:
    inputs:
      fedora:
        description: "Wersja Fedory (np. 44, 45; puste = z pliku FEDORA_VERSION)"
        required: false
        default: ""
      version:
        description: "Numer wersji HoryzontOS (np. 1.1.0; puste = z pliku VERSION)"
        required: false
        default: ""
      release_tag:
        description: "Dołącz ISO do istniejącego wydania (tag, np. v1.0.0; puste = nowe robocze wydanie)"
        required: false
        default: ""
  release:
    types: [published]

# zapis do wydania (gh release upload) — domyślny token ma w nowych repozytoriach tylko odczyt
permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Zwolnij miejsce na dysku
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sprawdź, czy tag wydania jest aktualny
        if: github.event_name == 'release'
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::warning::Tag ${{ github.event.release.tag_name }} wskazuje na starszy commit niż main ($(git log -1 --format='%h %s' HEAD)). ISO zawiera kod z tego commitu. Utwórz nowy tag z gałęzi main albo użyj Run workflow z polem „Dołącz do wydania”."
          fi
      - name: Zbuduj ISO w kontenerze Fedory
        env:
          # Run workflow: pola z okna; wydanie (Release): Fedora z pliku FEDORA_VERSION, numer z tagu (v1.1.0 → 1.1.0)
          IN_FEDORA: ${{ github.event.inputs.fedora }}
          IN_VERSION: ${{ github.event.inputs.version }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          FEDORA="${IN_FEDORA:-$(cat FEDORA_VERSION 2>/dev/null || echo 43)}"
          FEDORA="$(echo "$FEDORA" | tr -d '[:space:]')"
          VERSION="$(echo "${IN_VERSION:-${TAG#v}}" | tr -d '[:space:]')"
          if ! [[ "$FEDORA" =~ ^([0-9]+|rawhide)$ ]]; then echo "::error::Nieprawidłowa wersja Fedory: $FEDORA"; exit 1; fi
          if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^[A-Za-z0-9.+_-]+$ ]]; then
            echo "::error::Nieprawidłowy numer wersji HoryzontOS: $VERSION"; exit 1
          fi
          echo "Fedora $FEDORA, HoryzontOS ${VERSION:-$(cat VERSION)}"
          mkdir -p "$RUNNER_TEMP/work" out
          docker run --rm --privileged \
            -e RELEASEVER="$FEDORA" -e HORYZONTOS_VERSION="$VERSION" \
            -v "$PWD:/src" -v "$RUNNER_TEMP/work:/work" \
            "registry.fedoraproject.org/fedora:$FEDORA" \
            bash -c 'dnf -y install git && cd /src && WORK=/work OUT=/src/out ./build/build.sh'
          ls -lh out
      - name: Zapisz ISO w wydaniu
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.release_tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG="build-${{ github.run_id }}"
            if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
              gh release create "$TAG" --draft --target "${{ github.sha }}" \
                --title "HoryzontOS — build ${{ github.run_number }}" \
                --notes "Obraz testowy z commitu ${{ github.sha }}. Niezweryfikowany testem instalacji." \
                -R "${{ github.repository }}"
            fi
          fi
          cd out
          # GitHub przyjmuje w wydaniu pliki mniejsze niż 2 GiB; większe obrazy dzielone na części
          files=$(ls *.sha256)
          for f in *.iso; do
            if [ "$(stat -c %s "$f")" -ge 2147483648 ]; then
              split -b 1900M -d -a 1 "$f" "$f.part"
              files="$files $(ls "$f".part*)"
            else
              files="$files $f"
            fi
          done
          # stare pliki tego wydania (inne nazwy/części) usuwane, żeby nie zostało nieaktualne ISO
          for old in $(gh release view "$TAG" -R "${{ github.repository }}" --json assets -q '.assets[].name'); do
            case " $files " in *" $old "*) ;; *) gh release delete-asset "$TAG" "$old" -y -R "${{ github.repository }}" ;; esac
          done
          gh release upload "$TAG" $files --clobber -R "${{ github.repository }}"
          ls -lh
